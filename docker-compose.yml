services:
  app:
    build: .
    image: techmcrae-app:1.0
    container_name: techmcrae-app
    env_file: .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
      LOG_CHANNEL: stderr
    ports:
      - "8080:80"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: techmcrae-db
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: techmcrae-ngrok
    profiles: ["tunnel"]
    command: http app:80
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      app:
        condition: service_healthy
    networks: [backend]

networks:
  backend:

volumes:
  db_data:
  app_storage: